<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedra, Papel e Tesoura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pedra, Papel e Tesoura</h1>
  <p>Escolha uma opção para jogar contra o computador.</p>

  <button id="pedra">Pedra</button>
  <button id="papel">Papel</button>
  <button id="tesoura">Tesoura</button>

  <h2 id="resultado" aria-live="polite">Escolha uma opção!</h2>

  <p>Jogador: <span id="pontosJogador">0</span></p>
  <p>Computador: <span id="pontosComputador">0</span></p>
  <p>Empates: <span id="empates">0</span></p>

  <button id="zerar">Zerar placar</button>
  <script src="script.js"></script>
</body>
</html>
